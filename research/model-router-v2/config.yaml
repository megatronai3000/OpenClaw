      qwen2.5:14b:
        name: "Qwen 2.5 14B"
        cost_per_1k_input: 0.0
        cost_per_1k_output: 0.0
        quality_score: 0.85
        speed_score: 0.85
        context_window: 128000
        strengths: [reasoning, analysis, cost_free]
